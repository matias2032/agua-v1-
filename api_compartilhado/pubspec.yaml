name: api_compartilhado
description: Configurações partilhadas entre Web e Android para o sistema Gestor 365.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.4.0
  decimal: ^2.3.3
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  pdf: ^3.11.0
  printing: ^5.11.0
  open_filex: ^4.4.0
  file_picker: ^10.3.7   # Versão estável mais recente
  path_provider: ^2.1.3
  cloud_firestore: ^5.0.2
  firebase_core: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Recomendado para manter o código limpo