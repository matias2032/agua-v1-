name: bilhetes_vendedor_app
description: Aplicstivo Flutter para vendedores de bilhetes de autocarro
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  pdf: ^3.11.0
  printing: ^5.11.0
  open_file: ^3.3.2
  

  api_compartilhado:
    path: ../../api_compartilhado
  decimal: ^2.3.3  

  shared_preferences: ^2.2.3
    
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.8
