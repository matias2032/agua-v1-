# ===================================
# PERFIL: prod (Moçambique - Sistema de Gestão de Água)
# Todas as credenciais via variáveis de ambiente
# ===================================

# ── Base de dados (Neon / Railway / Koyeb) ───────────────────────────────────
# Nota: Certifique-se de que a DATABASE_URL comece com jdbc:postgresql://
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER:neondb_owner}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'validate' é o ideal para produção para garantir que o banco está como o script SQL definiu
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ── Servidor ──────────────────────────────────────────────────────────────────
# A porta é injetada automaticamente pela Cloud (Railway/Koyeb)
server.port=${PORT:8080}
server.servlet.context-path=/

# ── Localização e Data (Ajustado para Moçambique) ──────────────────────────────
spring.jackson.time-zone=Africa/Maputo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# ── HikariCP (Otimizado para instâncias pequenas/gratuitas) ──────────────────
# Limitar o pool ajuda a não estourar o limite de conexões da Neon (plano free)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000

# ── Firebase ──────────────────────────────────────────────────────────────────
# Como você vai usar a variável Base64, o path abaixo pode ser ignorado pelo seu código
# mas mantemos a chave para referência se o seu código buscar por ela.
firebase.service-account.b64=${FIREBASE_SERVICE_ACCOUNT_B64}

# ── Segurança (Autenticação do Sistema) ───────────────────────────────────────
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASS}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
# Ajuste o pacote abaixo para o nome real do seu projeto (ex: com.matias.agua)
logging.level.com.agua.v1=INFO
logging.level.org.hibernate.SQL=WARN

# ── Outras Configurações ──────────────────────────────────────────────────────
spring.main.banner-mode=off
spring.task.execution.pool.core-size=2