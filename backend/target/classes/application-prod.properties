# ===================================
# PERFIL: prod
# Todas as credenciais via variáveis de ambiente — nunca em texto plano
# ===================================

# ── Base de dados (Railway injeta DATABASE_URL automaticamente) ──────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ── Servidor ──────────────────────────────────────────────────────────────────
# Railway injeta PORT automaticamente
server.port=${PORT:8080}
server.servlet.context-path=/

# ── Encoding / Jackson ────────────────────────────────────────────────────────
spring.jackson.time-zone=Africa/Maputo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ── HikariCP (ajustado para cloud — evitar conexões ociosas a custo) ─────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=60000

# ── Logging (produção — sem SQL, sem TRACE) ───────────────────────────────────
logging.level.root=WARN
logging.level.com.agua.versao1=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Firebase — caminho do service account ─────────────────────────────────────
# Em produção o ficheiro é reconstituído a partir de uma variável base64
# (ver secção "Firebase em produção" abaixo)
firebase.service-account.path=firebase-service-account.json

# ── Async ─────────────────────────────────────────────────────────────────────
spring.task.execution.pool.core-size=4

# ── Segurança (não expor o utilizador padrão do Spring) ───────────────────────
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASS}